[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-tree"
dynamic = ["version"]
description = "An offline, Vim-friendly talent tree for tracking your LearnCpp progress"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RidaCode"}]
dependencies = []
classifiers = [
  "Environment :: Console :: Curses",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/RidaCode/cpp-tree"
Issues = "https://github.com/RidaCode/cpp-tree/issues"

[project.scripts]
cpp-tree = "cpp_tree.__main__:main"

[tool.setuptools]
packages = ["cpp_tree"]
include-package-data = true

[tool.setuptools.package-data]
cpp_tree = ["data/*.json"]

[tool.setuptools.dynamic]
version = {attr = "cpp_tree.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]
