name: Feature request
description: Suggest a focused improvement.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain your use case and any workaround you use now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Keep the tracker lightweight and offline. See CONTRIBUTING.md for scope.
    validations:
      required: true
